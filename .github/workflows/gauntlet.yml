name: gauntlet
on: [push, pull_request]
jobs:
  gauntlet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, aarch64-linux-android, aarch64-apple-ios
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-mutants,wasm-bindgen-cli@0.2.129
      - run: make lint test acceptance wasm targets coverage
      - run: make mutants
