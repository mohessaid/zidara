[package]
name = "zidara-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
zidara-kernel.workspace = true
zidara-frameworks.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1.28", features = ["v7", "serde"] }
reqwest = { version = "0.13", features = ["json"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
futures.workspace = true
wiremock = "0.6"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[lints]
workspace = true
