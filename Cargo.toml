[workspace]
resolver = "3"
members = ["crates/zidara-kernel", "crates/zidara-frameworks", "crates/zidara-acceptance", "crates/zidara-server"]

[workspace.package]
edition = "2024"
rust-version = "1.98"

[workspace.dependencies]
zidara-kernel = { path = "crates/zidara-kernel" }
zidara-frameworks = { path = "crates/zidara-frameworks" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28", default-features = false, features = ["serde"] }
thiserror = "2.0.21"
proptest = { version = "1.12", default-features = false, features = ["std"] }
wasm-bindgen-test = "0.3.79"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
cucumber = "0.23"
futures = "0.3.34"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
