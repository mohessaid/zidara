# Local PostgreSQL for running the server by hand (`make serve`). No restart policy:
# it runs only while you work. `make db-down` stops and removes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zidara
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      retries: 30
