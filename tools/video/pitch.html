<!doctype html>
<!-- The Solve pitch's cards, drawn as HTML/SVG at exact times (render.mjs-style). Part A comes
     before the recorded demo, part B after. English on screen; every number is from a test in
     this repository (docs/solve-evidence.md). Colours from docs/art-bible.md. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Noto Sans"; src: local("Noto Sans Bold"), local("NotoSans-Bold"); font-weight: 700; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff8ec; font-family: "Noto Sans", sans-serif; color: #1f2a44; }
  #stage { position: absolute; inset: 0; }
  .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 28px; padding: 0 160px; }
  h1 { font-size: 132px; margin: 0; letter-spacing: 2px; }
  h2 { font-size: 64px; margin: 0; }
  p { font-size: 46px; margin: 0; line-height: 1.4; }
  .muted { color: #5b6475; }
  .row { display: flex; gap: 48px; justify-content: center; }
  .box { border: 6px solid #1f2a44; border-radius: 28px; padding: 28px 40px; font-size: 40px; background: #fff; }
  .box.blue { border-color: #1f5fad; } .box.green { border-color: #1e7b4f; } .box.violet { border-color: #6b3fa0; }
  ul { list-style: none; margin: 0; padding: 0; text-align: start; font-size: 46px; line-height: 1.75; }
  li b { color: #1e7b4f; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const fade = (t, start, len = 0.6) => Math.max(0, Math.min(1, (t - start) / len));
const SCENES = {
  a: [
    { until: 8, html: (t) => `<div class="center"><h1 style="opacity:${fade(t, 0.2)}">Zidara</h1>
        <p style="opacity:${fade(t, 1.4)}">One learning app. Any teaching method.<br/>Offline. Arabic first.</p></div>` },
    { until: 22, html: (t) => `<div class="center"><h2>The problem</h2>
        <p style="opacity:${fade(t, 8.6)}">Platforms carry every tool, but not a school's way of teaching.</p>
        <p style="opacity:${fade(t, 12)}">Connections drop. Learning shouldn't.</p>
        <p style="opacity:${fade(t, 15.4)}">Arabic is too often an afterthought.</p>
        <p class="muted" style="opacity:${fade(t, 19)}">Here is the working prototype →</p></div>` },
  ],
  b: [
    { until: 18, html: (t) => `<div class="center"><h2>How it works</h2>
        <div class="row" style="opacity:${fade(t, 0.6)}"><div class="box green">Experiences<br/><span class="muted">a path for children · a light grid for low-end phones · the teacher studio</span></div></div>
        <div class="row" style="opacity:${fade(t, 3)}"><div class="box blue">Frameworks<br/><span class="muted">mastery · Cambridge-style · your own</span></div></div>
        <div class="row" style="opacity:${fade(t, 5.4)}"><div class="box">One kernel · the same code on phone and server</div></div>
        <div class="row" style="opacity:${fade(t, 8.4)}"><div class="box violet">AI drafts. Teachers decide. Everything can be undone.</div></div>
        <p class="muted" style="opacity:${fade(t, 11.5)}">A new teaching method is a new framework, not a new product.</p></div>` },
    { until: 42, html: (t) => `<div class="center"><h2>Proven by tests, not trust</h2>
        <ul>
          ${[
            ["Same answers", "on phone, browser and server: one recorded lesson, three machines"],
            ["Offline", "the app opens and the lesson works with no network at all"],
            ["Teachers decide", "the AI can never mark summative work; every AI action can be undone"],
            ["Accessible", "zero WCAG violations found; Lighthouse accessibility 100"],
            ["Light", "the whole kernel in the browser is 150 KB; low-end phones skip the game engine"],
            ["Efficient", "300 learners on 2 CPU cores, 95% of pages within 32 ms"],
          ].map(([a, b], i) => `<li style="opacity:${fade(t, 19 + i * 3)}"><b>${a}:</b> ${b}</li>`).join("")}
        </ul></div>` },
    { until: 52, html: (t) => `<div class="center"><h1 style="font-size:96px;opacity:${fade(t, 42.2)}">Zidara</h1>
        <p style="opacity:${fade(t, 43.4)}">A working prototype, October 2026.</p>
        <p class="muted" style="opacity:${fade(t, 45)}">Next: a pilot with a school and its teachers.</p></div>` },
  ],
};
window.PARTS = { a: 22, b: 52 };
window.render = (t, part) => {
  const scene = SCENES[part].find((s) => t < s.until) ?? SCENES[part].at(-1);
  document.getElementById("stage").innerHTML = scene.html(t);
};
window.ready = document.fonts.ready;
</script>
</body>
</html>
